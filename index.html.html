<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>يومي — العادات والوقت والمواعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202C; --muted:#5D6B7A; --line:#DCE2E8;
  --accent:#0F766E; --on-accent:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --p1:#C8372D; --p2:#B7791F; --p3:#4A6FA5; --danger:#C8372D;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10161D; --surface:#18212B; --ink:#E8EEF4; --muted:#93A1B0; --line:#2A3541; --p1:#F0766C; --p2:#E0A94A; --p3:#7FA4D8; --danger:#F0766C}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:4px 10px 4px 10px;background:var(--accent);display:inline-block}
#pageTitle{color:var(--muted);font-size:14px}

/* hero */
.hero{background:var(--accent);color:var(--on-accent);border-radius:26px 26px 26px 8px;padding:20px;margin:16px 0 8px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.hero-date{display:flex;align-items:center;gap:14px}
.hero .num{font-size:68px;font-weight:700;line-height:1;letter-spacing:-2px}
.hero .wd{font-size:22px;font-weight:600;line-height:1.2}
.hero .mo{opacity:.85;font-size:15px}
.hero .hello{grid-column:1/-1;font-size:15px;opacity:.95;margin-top:4px}
.ring{position:relative;width:84px;height:84px}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px 8px;margin:12px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;gap:8px}
.card-h h2{font-size:17px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.card-h + .row{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 0 12px}
.late{color:var(--danger)}

/* buttons */
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 16px;font-weight:600;min-height:42px}
.btn.small{padding:5px 12px;min-height:34px;font-size:14px;border-radius:999px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:10px;min-width:38px;min-height:38px;color:var(--muted);padding:0 10px;font-size:14px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:16px;line-height:1;color:transparent;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ico{flex:none;width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.p1{background:var(--p1)} .p2{background:var(--p2)} .p3{background:var(--p3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:38px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* timeline */
.tl{border-top:1px solid var(--line)}
.tl .row{align-items:flex-start;border-top:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:start;border-inline:0}
.tl .time{flex:none;width:86px;font-size:13px;color:var(--muted);padding-top:2px;line-height:1.5}
.tl .row.now{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px;width:calc(100% + 32px)}
.tl .row.now .time{color:var(--ink);font-weight:600}
.tl .bar{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--accent)}

/* habit week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 0 12px}
.dayb{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);min-height:50px}
.dayb b{font-size:15px;color:var(--ink);font-weight:600}
.dayb.sched{border-color:var(--muted)}
.dayb.off{border-style:dashed;opacity:.55}
.dayb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dayb.on b{color:var(--on-accent)}
.dayb.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.hh{display:flex;align-items:center;gap:12px;padding:12px 0 8px}

/* appointments */
.date-box{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--accent-soft);padding:5px 0;line-height:1.2}
.date-box b{display:block;font-size:22px}
.date-box span{font-size:12px;color:var(--muted)}
.row.past{opacity:.6}

/* pomodoro */
.pomo{display:flex;align-items:center;gap:12px;padding:8px 0 10px;flex-wrap:wrap}
.pomo .disp{font-size:40px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;min-width:122px}
.pomo .lbl{font-size:13px;color:var(--muted)}

/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--muted);position:relative;min-height:60px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:600}
.nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

/* alerts */
#alerts{position:fixed;top:60px;inset-inline:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding:0 16px;pointer-events:none}
.alert{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.alert .grow{flex:1}
.alert button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:4px 12px;min-height:34px}

/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(10,16,22,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:19px}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:14px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.f input[type=time],.f input[type=date]{text-align:right}
.f input[type=color]{padding:3px;height:44px}
.f.bad input,.f.bad select{border-color:var(--danger)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.day.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.err{color:var(--danger);font-size:14px}
.acts{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.acts .r{display:flex;gap:8px}

/* settings */
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.note{font-size:13.5px;color:var(--muted);padding:2px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px;padding:6px 0 12px}

@media (prefers-reduced-motion:no-preference){
  .chk,.dayb,.btn{transition:background .15s,border-color .15s}
}
@media print{.nav,.top{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><i></i>يومي</div><div id="pageTitle"></div></div></header>
<div id="alerts" role="status" aria-live="polite"></div>
<main class="wrap" id="view"></main>
<nav class="nav" aria-label="التنقل"><div class="wrap" id="nav"></div></nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
/* ============ أدوات مساعدة ============ */
const $=(s,e=document)=>e.querySelector(s);
const el=(tag,attrs={},...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')n.className=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{if(c===false||c==null)return;n.append(c.nodeType?c:document.createTextNode(c))});
  return n;
};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>key(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return key(d)};
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const t12=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return `${h%12||12}:${pad(m)} ${h<12?'ص':'م'}`};
const LOC='ar-u-nu-latn';
const dLabel=k=>parseKey(k).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});
const DAY_NAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_ORDER=[6,0,1,2,3,4,5];
const PRI={1:['عالية','p1'],2:['متوسطة','p2'],3:['منخفضة','p3']};
const REMIND=[[0,'بدون تذكير'],[5,'قبلها بـ 5 دقائق'],[15,'قبلها بـ 15 دقيقة'],[30,'قبلها بنصف ساعة'],[60,'قبلها بساعة'],[180,'قبلها بـ 3 ساعات'],[1440,'قبلها بيوم']];
const remindLabel=m=>(REMIND.find(r=>r[0]===m)||[0,'بدون تذكير'])[1];

/* ============ الحفظ ============ */
const KEY='yawmi-v1';
let mem=null,storageOK=true;
function seed(){
  const t=today();
  return{
    settings:{accent:'#0F766E',name:''},
    habits:[
      {id:uid(),name:'شرب الماء',icon:'💧',days:[0,1,2,3,4,5,6],time:'',log:{}},
      {id:uid(),name:'قراءة 20 دقيقة',icon:'📖',days:[0,1,2,3,4,5,6],time:'21:00',log:{}},
      {id:uid(),name:'رياضة',icon:'🏃',days:[6,1,3],time:'18:00',log:{}}
    ],
    tasks:[
      {id:uid(),title:'مراجعة أولويات الأسبوع',priority:1,due:t,note:'',done:false},
      {id:uid(),title:'ترتيب الملفات',priority:3,due:'',note:'',done:false}
    ],
    appts:[{id:uid(),title:'موعد تجريبي — عدّله أو احذفه',date:addDays(t,1),time:'10:00',place:'',note:'',remind:15}],
    blocks:[{id:uid(),title:'وقت التركيز',start:'09:00',end:'11:00',rep:'daily',date:''}],
    fired:{}
  };
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return Object.assign(seed(),JSON.parse(r))}catch(e){storageOK=false}
  return mem?JSON.parse(mem):seed();
}
function save(){
  const s=JSON.stringify(S);mem=s;
  try{localStorage.setItem(KEY,s)}catch(e){storageOK=false}
}
let S=load();
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}

/* ============ لون التطبيق ============ */
function lum(hex){
  const n=parseInt(hex.slice(1),16);
  const[r,g,b]=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b;
}
function applyAccent(c){
  const r=document.documentElement.style;
  r.setProperty('--accent',c);
  r.setProperty('--on-accent',lum(c)>0.42?'#10161D':'#FFFFFF');
}
applyAccent(S.settings.accent);

/* ============ منطق العادات ============ */
const scheduled=(h,k)=>h.days.includes(parseKey(k).getDay());
function streak(h){
  let k=today();
  if(scheduled(h,k)&&!h.log[k])k=addDays(k,-1);
  let n=0;
  for(let i=0;i<730;i++){
    if(scheduled(h,k)){if(h.log[k])n++;else break}
    k=addDays(k,-1);
  }
  return n;
}
function toggleHabit(h,k){
  if(h.log[k])delete h.log[k];else h.log[k]=true;
  save();render();
}
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');

/* ============ منطق المواعيد ============ */
const apptDate=a=>{const[y,m,d]=a.date.split('-').map(Number);const[hh,mm]=(a.time||'00:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm)};
function until(a){
  const mins=Math.round((apptDate(a)-new Date())/60000);
  if(mins<0)return'فات موعده';
  if(mins<60)return mins<=1?'بعد دقيقة':`بعد ${mins} ${mins<=10?'دقائق':'دقيقة'}`;
  if(mins<1440){const h=Math.round(mins/60);return h===1?'بعد ساعة':`بعد ${h} ${h<=10?'ساعات':'ساعة'}`}
  const n=Math.round((parseKey(a.date)-parseKey(today()))/864e5);
  return n===1?'غداً':n===2?'بعد يومين':`بعد ${n} ${n<=10?'أيام':'يوماً'}`;
}
function icsFor(a){
  const[y,m,d]=a.date.split('-');const[hh,mm]=(a.time||'09:00').split(':');
  const e=new Date(+y,+m-1,+d,+hh,+mm+60);
  const stamp=`${y}${m}${d}T${hh}${mm}00`;
  const end=`${e.getFullYear()}${pad(e.getMonth()+1)}${pad(e.getDate())}T${pad(e.getHours())}${pad(e.getMinutes())}00`;
  const esc=s=>(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Yawmi//AR//','BEGIN:VEVENT',
    `UID:${a.id}@yawmi`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,
    `DTSTART:${stamp}`,`DTEND:${end}`,`SUMMARY:${esc(a.title)}`];
  if(a.place)L.push(`LOCATION:${esc(a.place)}`);
  if(a.note)L.push(`DESCRIPTION:${esc(a.note)}`);
  if(a.remind>0)L.push('BEGIN:VALARM',`TRIGGER:-PT${a.remind}M`,'ACTION:DISPLAY','DESCRIPTION:تذكير','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR');
  return L.join('\r\n');
}
function download(name,text,type){
  const u=URL.createObjectURL(new Blob([text],{type}));
  const a=el('a',{href:u,download:name});document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}

/* ============ التنبيهات ============ */
function beep(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.12;o.start();o.stop(c.currentTime+.25);
  }catch(e){}
}
function toast(msg,sub){
  const box=$('#alerts');
  const n=el('div',{class:'alert',role:'alert'},
    el('div',{class:'grow'},el('div',{style:'font-weight:600'},msg),sub&&el('div',{style:'font-size:13px;opacity:.8'},sub)),
    el('button',{onclick:()=>n.remove()},'حسناً'));
  box.append(n);beep();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(msg,{body:sub||''})}catch(e){}
}
function checkReminders(){
  const now=new Date();let changed=false;
  S.appts.forEach(a=>{
    if(!a.remind)return;
    const at=apptDate(a);
    const fireAt=new Date(at-a.remind*60000);
    const k=`${a.id}|${a.date}|${a.time}|${a.remind}`;
    if(now>=fireAt&&now<new Date(at.getTime()+30*60000)&&!S.fired[k]){
      S.fired[k]=1;changed=true;
      toast(`تذكير: ${a.title}`,`${dLabel(a.date)} — ${t12(a.time)}${a.place?' — '+a.place:''}`);
    }
  });
  if(changed)save();
}

/* ============ النماذج (نافذة الإضافة والتعديل) ============ */
function openForm({title,fields,values={},onSave,onDelete,validate}){
  const dlg=$('#dlg'),box=$('#dlgBody');box.replaceChildren();
  const getters={},wraps={};
  box.append(el('h2',{},title));
  fields.forEach(f=>{
    let input;
    if(f.type==='select'){
      input=el('select',{},f.options.map(([v,l])=>el('option',{value:v},l)));
      input.value=String(values[f.key]??f.options[0][0]);
      getters[f.key]=()=>input.value;
    }else if(f.type==='textarea'){
      input=el('textarea',{rows:3,placeholder:f.ph||''});input.value=values[f.key]||'';
      getters[f.key]=()=>input.value.trim();
    }else if(f.type==='days'){
      const sel=new Set(values[f.key]??[0,1,2,3,4,5,6]);
      input=el('div',{class:'days'});
      DAY_ORDER.forEach(i=>{
        const b=el('button',{type:'button',class:'day'+(sel.has(i)?' on':''),'aria-pressed':String(sel.has(i))},DAY_NAMES[i]);
        b.addEventListener('click',()=>{sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('on',sel.has(i));b.setAttribute('aria-pressed',String(sel.has(i)))});
        input.append(b);
      });
      getters[f.key]=()=>[...sel].sort();
    }else{
      input=el('input',{type:f.type||'text',placeholder:f.ph||'',maxlength:f.max||null});
      input.value=values[f.key]||'';
      getters[f.key]=()=>input.value.trim();
    }
    const w=el('label',{class:'f'},el('span',{},f.label+(f.req?' *':'')),input);
    wraps[f.key]=w;box.append(w);
  });
  const err=el('div',{class:'err',role:'alert'});box.append(err);
  const save_=el('button',{class:'btn',type:'button'},'حفظ');
  save_.addEventListener('click',()=>{
    const vals={};let ok=true;
    fields.forEach(f=>{
      vals[f.key]=getters[f.key]();
      const bad=f.req&&(Array.isArray(vals[f.key])?!vals[f.key].length:!vals[f.key]);
      wraps[f.key].classList.toggle('bad',!!bad);if(bad)ok=false;
    });
    if(!ok){err.textContent='املأ الحقول المطلوبة (*).';return}
    const msg=validate&&validate(vals);
    if(msg){err.textContent=msg;return}
    onSave(vals);save();dlg.close();render();
  });

}

/* ============ مؤقّت التركيز ============ */
const pomo={mode:'focus',left:25*60,run:false,endAt:0,timer:null};
let pomoEl=null;
function pomoText(){return `${pad(Math.floor(pomo.left/60))}:${pad(pomo.left%60)}`}
function pomoSync(){
  if(!pomoEl)return;
  $('.disp',pomoEl).textContent=pomoText();
  $('.lbl',pomoEl).textContent=pomo.mode==='focus'?'جلسة تركيز':'استراحة';
  $('.go',pomoEl).textContent=pomo.run?'إيقاف مؤقت':'ابدأ';
}
function pomoTick(){
  pomo.left=Math.max(0,Math.round((pomo.endAt-Date.now())/1000));
  if(pomo.left===0){
    clearInterval(pomo.timer);pomo.run=false;
    const wasFocus=pomo.mode==='focus';
    pomo.mode=wasFocus?'break':'focus';pomo.left=(wasFocus?5:25)*60;
    toast(wasFocus?'انتهت جلسة التركيز':'انتهت الاستراحة',wasFocus?'خذ استراحة 5 دقائق.':'ابدأ جلسة تركيز جديدة.');
  }
  pomoSync();
}
function pomoGo(){
  if(pomo.run){clearInterval(pomo.timer);pomo.run=false;pomoTick()}
  else{pomo.run=true;pomo.endAt=Date.now()+pomo.left*1000;pomo.timer=setInterval(pomoTick,500)}
  pomoSync();
}
function pomoReset(){
  clearInterval(pomo.timer);pomo.run=false;pomo.mode='focus';pomo.left=25*60;pomoSync();
}
function buildPomo(){
  if(pomoEl)return pomoEl;
  pomoEl=el('div',{class:'pomo'},
    el('div',{class:'disp'},pomoText()),
    el('div',{style:'flex:1;min-width:90px'},el('div',{class:'lbl'},'جلسة تركيز')),
    el('button',{class:'btn small go',onclick:pomoGo},'ابدأ'),
    el('button',{class:'btn small ghost',onclick:pomoReset},'إعادة'));
  pomoSync();return pomoEl;
}

function taskRow(t){
  const late=t.due&&!t.done&&t.due<today();
  return el('div',{class:'row'+(t.done?' done':'')},
    el('button',{class:'chk'+(t.done?' on':''),'aria-label':t.done?'إلغاء الإنجاز':'تمّت','aria-pressed':String(!!t.done),onclick:()=>{t.done=!t.done;save();render()}},'✓'),
    el('div',{class:'grow'},
      el('div',{class:'t'},t.title),

    el('button',{class:'icon-btn','aria-label':'تعديل',onclick:()=>taskForm(t)},'تعديل'));

function sortTasks(a,b){
  return (a.done-b.done)||(a.priority-b.priority)||((a.due||'9999').localeCompare(b.due||'9999'));

/* ============ الصفحة: اليوم ============ */
function renderToday(root){
  const t=today(),d=new Date();
  const hs=S.habits.filter(h=>scheduled(h,t)).sort(byTime);
  const done=hs.filter(h=>h.log[t]).length;
  const pct=hs.length?done/hs.length:0;
  const C=2*Math.PI*34;
  const hr=d.getHours();
  const hello=(hr<12?'صباح الخير':hr<18?'مساء الخير':'مساء النور')+(S.settings.name?'، '+S.settings.name:'')+
    (hs.length?(done===hs.length?' — أنجزت كل عادات اليوم.':` — أنجزت ${done} من ${hs.length} عادات.`):' — لا عادات مجدولة اليوم.');
  const ring=el('div',{class:'ring','aria-hidden':'true'});
  ring.innerHTML=`<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-dasharray="${pct*C} ${C}" transform="rotate(-90 42 42)"/></svg>`;
  ring.append(el('b',{},Math.round(pct*100)+'%'));
  root.append(el('section',{class:'hero'},
    el('div',{class:'hero-date'},
      el('div',{class:'num'},d.getDate()),
      el('div',{},el('div',{class:'wd'},d.toLocaleDateString(LOC,{weekday:'long'})),el('div',{class:'mo'},d.toLocaleDateString(LOC,{month:'long',year:'numeric'})))),
    ring,el('p',{class:'hello'},hello)));

  /* المهم الآن */
  const nextA=S.appts.filter(a=>apptDate(a)>=new Date()).sort((a,b)=>apptDate(a)-apptDate(b)).slice(0,2);
  const tasks=S.tasks.filter(x=>!x.done&&((x.due&&x.due<=t)||x.priority===1)).sort(sortTasks).slice(0,5);
  const imp=card('الأهم الآن','+ مهمة',()=>taskForm());
  nextA.forEach(a=>imp.append(el('div',{class:'row'},
    el('div',{class:'ico'},'📅'),
    el('div',{class:'grow'},el('div',{class:'t'},a.title),el('div',{class:'s'},`${dLabel(a.date)} — ${t12(a.time)}`)),
    el('span',{class:'chip'},until(a)))));
  tasks.forEach(x=>imp.append(taskRow(x)));
  if(!nextA.length&&!tasks.length)imp.append(empty('لا شيء عاجل. أضف مهمة أو موعداً.'));
  root.append(imp);

  /* عادات اليوم */
  const hc=card('عادات اليوم','+ عادة',()=>habitForm());
  hs.forEach(h=>hc.append(el('div',{class:'row'},
    el('button',{class:'chk'+(h.log[t]?' on':''),'aria-label':'تمّت: '+h.name,'aria-pressed':String(!!h.log[t]),onclick:()=>toggleHabit(h,t)},'✓'),
    el('div',{class:'ico'},h.icon||'✅'),
    el('div',{class:'grow'},el('div',{class:'t'},h.name),h.time?el('div',{class:'s'},t12(h.time)):null),
    streak(h)>0?el('span',{class:'chip'},'🔥 '+streak(h)):null)));
  if(!hs.length)hc.append(empty('لا عادات مجدولة اليوم.'));
  root.append(hc);

  /* جدول اليوم */
  const blocks=S.blocks.filter(b=>b.rep==='daily'||b.date===t).sort((a,b)=>a.start.localeCompare(b.start));
  const nowT=nowHM();
  const tl=card('جدول اليوم','+ فترة',()=>blockForm());
  const list=el('div',{class:'tl'});
  blocks.forEach(b=>{
    const isNow=b.start<=nowT&&nowT<b.end;
    list.append(el('button',{class:'row'+(isNow?' now':''),onclick:()=>blockForm(b),'aria-label':'تعديل '+b.title},
      el('div',{class:'time'},t12(b.start),el('br'),t12(b.end)),
      el('div',{class:'bar'}),
      el('div',{class:'grow'},el('div',{class:'t'},b.title),el('div',{class:'s'},(isNow?'الآن · ':'')+(b.rep==='daily'?'يومياً':'اليوم فقط')))));
  });
  if(blocks.length)tl.append(list);else tl.append(empty('قسّم يومك إلى فترات: عمل، دراسة، راحة…'));
  root.append(tl);

  root.append(card('مؤقّت التركيز',null,null,buildPomo()));
}

      el('p',{class:'note',style:'padding:0'},storageOK?'تُحفظ بياناتك في هذا المتصفح على هذا الجهاز فقط. صدّر نسخة احتياطية من وقت لآخر.':'تنبيه: المتصفح يمنع الحفظ الدائم هنا، وستضيع البيانات عند إغلاق الصفحة. افتح الملف مباشرة من جهازك في المتصفح، أو صدّر نسخة احتياطية.'),
      el('button',{class:'btn',onclick:()=>download(`yawmi-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json')},'تصدير نسخة احتياطية'),
      el('button',{class:'btn ghost',onclick:()=>file.click()},'استيراد نسخة احتياطية'),file,
      el('button',{class:'btn danger',onclick:()=>{if(confirm('سيُحذف كل شيء: العادات والمهام والمواعيد. متابعة؟')){const a=S.settings;S={settings:a,habits:[],tasks:[],appts:[],blocks:[],fired:{}};save();render()}}},'مسح كل شيء والبدء من الصفر'))));
}

/* ============ التنقل والعرض ============ */
const TABS=[
  ['today','اليوم','<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'],
  ['habits','العادات','<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'],
  ['tasks','المهام','<path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>'],
  ['appts','المواعيد','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ['settings','الإعدادات','<path d="M4 7h10M18 7h2M4 17h2M10 17h10M4 12h4M12 12h8"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="10" cy="12" r="2"/>']
];
const TITLES=Object.fromEntries(TABS.map(t=>[t[0],t[1]]));
let tab='today';
const nav=$('#nav');
TABS.forEach(([id,label,svg])=>{
  const b=el('button',{'data-tab':id,onclick:()=>{tab=id;render();scrollTo(0,0)}});
  b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg><span>${label}</span>`;
  nav.append(b);
});
function render(){
  const root=$('#view');root.replaceChildren();
  ({today:renderToday,habits:renderHabits,tasks:renderTasks,appts:renderAppts,settings:renderSettings})[tab](root);
  nav.querySelectorAll('button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#pageTitle').textContent=TITLES[tab];
}
render();
checkReminders();
setInterval(()=>{
  checkReminders();
  if(tab==='today'&&!$('#dlg').open)render();
},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(!$('#dlg').open)render()}});
</script>
</body>
